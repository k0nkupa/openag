name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm --filter daemon typecheck:tests
      - run: pnpm -r test
      - run: node scripts/verify-bot-knowledge.mjs
      - run: node scripts/verify-capabilities.mjs
      - run: node scripts/verify-onboard.mjs
