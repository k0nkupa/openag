name: Bug report
description: Something in OpenAg does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security issue? Do not file it here. Use **Security → Report a vulnerability** (see SECURITY.md).
        Remove tokens, keys, pairing codes and personal data from anything you paste.
  - type: input
    id: version
    attributes:
      label: OpenAg version
      description: The release tag or commit (`git rev-parse --short HEAD`).
      placeholder: v0.5.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS version, Node version (`node -v`), and how you run the daemon (`pnpm onboard`, launchd service, foreground).
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Model source involved
      multiple: true
      options: [Claude Code, Codex, OpenAI / Anthropic / OpenRouter API, Ollama, Not model-related]
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Daemon output or `$OPENAG_DATA/logs/` excerpts, with secrets removed.
      render: text
